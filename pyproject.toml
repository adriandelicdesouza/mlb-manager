[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-manager"
version = "0.2.0"
description = "Terminal baseball franchise management and simulation game"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Adrian Delic de Souza" }]
dependencies = []

[project.scripts]
mlb-manager = "mlb_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
